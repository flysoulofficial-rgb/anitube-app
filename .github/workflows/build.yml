name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests
        run: |
          set +e
          gradle testDebugUnitTest --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^e: |FAILED|AssertionError|What went wrong|Caused by|Unresolved|expected" -A3 build.log | head -90 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle tests::$msg"
          fi
          exit $code

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --stacktrace > build2.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^e: |What went wrong|Caused by|Unresolved" -A3 build2.log | head -90 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle build::$msg"
          fi
          exit $code

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AniTube.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniTube-APK
          path: AniTube.apk

      - name: Publish APK as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AniTube build ${{ github.run_number }}
          prerelease: true
          files: AniTube.apk
